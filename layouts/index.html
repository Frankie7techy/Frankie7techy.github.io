{{ define "main" }}
  <article class="post-content home-intro">
    {{ .Content }}
  </article>
  <h2 class="home-subhead">Recent posts</h2>
  <ul class="home-posts">
  {{ range .Site.RegularPages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="home-date">{{ .Date.Format "2006-01-02" }}</span>
    </li>
  {{ end }}
  </ul>
{{ end }}
