<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 312" font-family="Consolas, monospace" role="img">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#00ff41"/></marker><marker id="ahc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#00d4ff"/></marker></defs>
<rect x="0" y="0" width="1180" height="100%" fill="#0a0a0a"/>
<text x="590.0" y="44" fill="#00ff41" font-size="26" font-weight="bold" text-anchor="middle">PHANTOM DROP</text>
<text x="590.0" y="82" fill="#8c8c8c" font-size="15" text-anchor="middle">52 seconds of packet capture, five suspicious requests, one flag</text>
<rect x="30" y="164" width="200" height="100" rx="10" fill="#0f0f0f" stroke="#8c8c8c" stroke-width="1.4"/>
<text x="44" y="191" fill="#8c8c8c" font-size="17" font-weight="bold">T+0s  windowsupdate</text>
<text x="44" y="214" fill="#9a9a9a" font-size="14">GET wuident.cab</text>
<text x="44" y="234" fill="#9a9a9a" font-size="14">returns an MZ (PE)</text>
<text x="44" y="254" fill="#9a9a9a" font-size="14">a cab that is not a cab</text>
<rect x="258" y="164" width="200" height="100" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="272" y="191" fill="#ffbd2e" font-size="17" font-weight="bold">T+2s  loader</text>
<text x="272" y="214" fill="#9a9a9a" font-size="14">GET /stage1/loader.ps1</text>
<text x="272" y="234" fill="#9a9a9a" font-size="14">hex and XOR obfuscated</text>
<text x="272" y="254" fill="#9a9a9a" font-size="14">text/plain, 4170 B</text>
<rect x="486" y="164" width="200" height="100" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="500" y="191" fill="#ffbd2e" font-size="17" font-weight="bold">T+21s  beacon</text>
<text x="500" y="214" fill="#9a9a9a" font-size="14">POST /v2/beacon</text>
<text x="500" y="234" fill="#9a9a9a" font-size="14">host, user, os, cid</text>
<text x="500" y="254" fill="#9a9a9a" font-size="14">reply: fetch_payload</text>
<rect x="714" y="164" width="200" height="100" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="728" y="191" fill="#ffbd2e" font-size="17" font-weight="bold">T+26s  payload</text>
<text x="728" y="214" fill="#9a9a9a" font-size="14">GET /v2/payload</text>
<text x="728" y="234" fill="#9a9a9a" font-size="14">base64 ZIP, 206 partial</text>
<text x="728" y="254" fill="#9a9a9a" font-size="14">staged on the host</text>
<rect x="942" y="164" width="208" height="100" rx="10" fill="#0f0f0f" stroke="#ff5f56" stroke-width="1.4"/>
<text x="956" y="191" fill="#ff5f56" font-size="17" font-weight="bold">T+39s  exfil</text>
<text x="956" y="214" fill="#9a9a9a" font-size="14">POST /report</text>
<text x="956" y="234" fill="#9a9a9a" font-size="14">data = base64 ZIP</text>
<text x="956" y="254" fill="#9a9a9a" font-size="14">creds leave the host</text>
<path d="M230,214.0 C244.0,214.0 244.0,214.0 252,214.0" fill="none" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M458,214.0 C472.0,214.0 472.0,214.0 480,214.0" fill="none" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M686,214.0 C700.0,214.0 700.0,214.0 708,214.0" fill="none" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M914,214.0 C928.0,214.0 928.0,214.0 936,214.0" fill="none" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>