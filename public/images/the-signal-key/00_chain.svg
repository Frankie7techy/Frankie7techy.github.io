<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 318" font-family="Fira Code, Consolas, monospace" role="img">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#00ff41"/></marker></defs>
<rect x="0" y="0" width="1256" height="318" fill="#0a0a0a"/>
<text x="628" y="46" fill="#00ff41" font-size="26" font-weight="bold" text-anchor="middle">THE SIGNAL KEY</text>
<text x="628" y="84" fill="#6a6a6a" font-size="15" text-anchor="middle">a React Native bundle with an obfuscated string table and a tiny round cipher</text>
<rect x="30" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00d4ff" stroke-width="1.4"/>
<text x="44" y="180" fill="#00d4ff" font-size="16" font-weight="bold">1. Bundle</text>
<text x="44" y="204" fill="#9a9a9a" font-size="13">index.android</text>
<text x="44" y="224" fill="#9a9a9a" font-size="13">.bundle</text>
<text x="44" y="244" fill="#9a9a9a" font-size="13">plain JS</text>
<line x1="254" y1="204" x2="270" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="274" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="288" y="180" fill="#ffbd2e" font-size="16" font-weight="bold">2. Un-rotate</text>
<text x="288" y="204" fill="#9a9a9a" font-size="13">__STR_ARR</text>
<text x="288" y="224" fill="#9a9a9a" font-size="13">rotator(12)</text>
<text x="288" y="244" fill="#9a9a9a" font-size="13">11 shifts left</text>
<line x1="498" y1="204" x2="514" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="518" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00d4ff" stroke-width="1.4"/>
<text x="532" y="180" fill="#00d4ff" font-size="16" font-weight="bold">3. __sidx</text>
<text x="532" y="204" fill="#9a9a9a" font-size="13">base64 decode</text>
<text x="532" y="224" fill="#9a9a9a" font-size="13">then -3 each</text>
<text x="532" y="244" fill="#9a9a9a" font-size="13">byte</text>
<line x1="742" y1="204" x2="758" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="762" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="776" y="180" fill="#ffbd2e" font-size="16" font-weight="bold">4. Decode</text>
<text x="776" y="204" fill="#9a9a9a" font-size="13">__cipherDecode</text>
<text x="776" y="224" fill="#9a9a9a" font-size="13">4 rounds: rot</text>
<text x="776" y="244" fill="#9a9a9a" font-size="13">sub, xor key</text>
<line x1="986" y1="204" x2="1002" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1006" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00ff41" stroke-width="1.4"/>
<text x="1020" y="180" fill="#00ff41" font-size="16" font-weight="bold">5. Flag</text>
<text x="1020" y="204" fill="#9a9a9a" font-size="13">key dojo-signal</text>
<text x="1020" y="224" fill="#9a9a9a" font-size="13">screen + button</text>
<text x="1020" y="244" fill="#9a9a9a" font-size="13">r00t{...}</text>
</svg>