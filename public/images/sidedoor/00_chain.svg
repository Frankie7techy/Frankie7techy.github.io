<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1256 318" font-family="Fira Code, Consolas, monospace" role="img">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#00ff41"/></marker></defs>
<rect x="0" y="0" width="1256" height="318" fill="#0a0a0a"/>
<text x="628" y="46" fill="#00ff41" font-size="26" font-weight="bold" text-anchor="middle">SIDEDOOR</text>
<text x="628" y="84" fill="#6a6a6a" font-size="15" text-anchor="middle">a cloud backup client that mailed a recovery token over plain, unauthenticated HTTP</text>
<rect x="30" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00d4ff" stroke-width="1.4"/>
<text x="44" y="180" fill="#00d4ff" font-size="16" font-weight="bold">1. Capture</text>
<text x="44" y="204" fill="#9a9a9a" font-size="13">capture.pcap</text>
<text x="44" y="224" fill="#9a9a9a" font-size="13">3692 frames</text>
<text x="44" y="244" fill="#9a9a9a" font-size="13">one odd host</text>
<line x1="254" y1="204" x2="270" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="274" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="288" y="180" fill="#ffbd2e" font-size="16" font-weight="bold">2. Filter</text>
<text x="288" y="204" fill="#9a9a9a" font-size="13">http to</text>
<text x="288" y="224" fill="#9a9a9a" font-size="13">cloudbackup</text>
<text x="288" y="244" fill="#9a9a9a" font-size="13">non-standard port</text>
<line x1="498" y1="204" x2="514" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="518" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00d4ff" stroke-width="1.4"/>
<text x="532" y="180" fill="#00d4ff" font-size="16" font-weight="bold">3. Reassemble</text>
<text x="532" y="204" fill="#9a9a9a" font-size="13">multipart/</text>
<text x="532" y="224" fill="#9a9a9a" font-size="13">form-data</text>
<text x="532" y="244" fill="#9a9a9a" font-size="13">backup file</text>
<line x1="742" y1="204" x2="758" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="762" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="776" y="180" fill="#ffbd2e" font-size="16" font-weight="bold">4. Read</text>
<text x="776" y="204" fill="#9a9a9a" font-size="13">recovery-token:</text>
<text x="776" y="224" fill="#9a9a9a" font-size="13">r00t{...}</text>
<text x="776" y="244" fill="#9a9a9a" font-size="13">in the body</text>
<line x1="986" y1="204" x2="1002" y2="204" stroke="#00ff41" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1006" y="150" width="220" height="108" rx="10" fill="#0f0f0f" stroke="#00ff41" stroke-width="1.4"/>
<text x="1020" y="180" fill="#00ff41" font-size="16" font-weight="bold">5. Flag</text>
<text x="1020" y="204" fill="#9a9a9a" font-size="13">no crypto</text>
<text x="1020" y="224" fill="#9a9a9a" font-size="13">no key</text>
<text x="1020" y="244" fill="#9a9a9a" font-size="13">export objects</text>
</svg>