<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 308" font-family="Consolas, monospace" role="img">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#00ff41"/></marker></defs>
<rect x="0" y="0" width="1180" height="100%" fill="#0a0a0a"/>
<text x="590.0" y="44" fill="#00ff41" font-size="26" font-weight="bold" text-anchor="middle">GULLTOWN FERRY MANIFEST</text>
<text x="590.0" y="82" fill="#8c8c8c" font-size="15" text-anchor="middle">a weight field that reaches a shell, and a root helper that trusts PATH</text>
<rect x="30" y="164" width="200" height="96" rx="10" fill="#0f0f0f" stroke="#00d4ff" stroke-width="1.4"/>
<text x="44" y="191" fill="#00d4ff" font-size="17" font-weight="bold">1. Manifest form</text>
<text x="44" y="214" fill="#9a9a9a" font-size="14">POST /submit</text>
<text x="44" y="234" fill="#9a9a9a" font-size="14">cargo_desc</text>
<text x="44" y="254" fill="#9a9a9a" font-size="14">weight, notes</text>
<rect x="258" y="164" width="200" height="96" rx="10" fill="#0f0f0f" stroke="#ff5f56" stroke-width="1.4"/>
<text x="272" y="191" fill="#ff5f56" font-size="17" font-weight="bold">2. Command inject</text>
<text x="272" y="214" fill="#9a9a9a" font-size="14">weight = "x; id"</text>
<text x="272" y="234" fill="#9a9a9a" font-size="14">value hits a shell</text>
<text x="272" y="254" fill="#9a9a9a" font-size="14">output reflected</text>
<rect x="486" y="164" width="200" height="96" rx="10" fill="#0f0f0f" stroke="#ff5f56" stroke-width="1.4"/>
<text x="500" y="191" fill="#ff5f56" font-size="17" font-weight="bold">3. Shell</text>
<text x="500" y="214" fill="#9a9a9a" font-size="14">runs as www-data</text>
<text x="500" y="234" fill="#9a9a9a" font-size="14">enumerate the box</text>
<text x="500" y="254" fill="#9a9a9a" font-size="14">find a root helper</text>
<rect x="714" y="164" width="200" height="96" rx="10" fill="#0f0f0f" stroke="#ffbd2e" stroke-width="1.4"/>
<text x="728" y="191" fill="#ffbd2e" font-size="17" font-weight="bold">4. PATH hijack</text>
<text x="728" y="214" fill="#9a9a9a" font-size="14">manifest-stamp runs</text>
<text x="728" y="234" fill="#9a9a9a" font-size="14">as root, execs</text>
<text x="728" y="254" fill="#9a9a9a" font-size="14">"stamp-helper"</text>
<rect x="942" y="164" width="208" height="96" rx="10" fill="#0f0f0f" stroke="#00ff41" stroke-width="1.4"/>
<text x="956" y="191" fill="#00ff41" font-size="17" font-weight="bold">5. Root</text>
<text x="956" y="214" fill="#9a9a9a" font-size="14">our helper runs</text>
<text x="956" y="234" fill="#9a9a9a" font-size="14">as root, reads</text>
<text x="956" y="254" fill="#9a9a9a" font-size="14">/root/root.txt</text>
