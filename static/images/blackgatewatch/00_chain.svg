<text x="532" y="180" fill="#00d4ff" font-size="16" font-weight="bold">3. Pattern</text>
<text x="532" y="204" fill="#9a9a9a" font-size="13">seq label 000</text>
<text x="532" y="224" fill="#9a9a9a" font-size="13">hex label</text>
<text x="532" y="244" fill="#9a9a9a" font-size="13">fixed relay</text>
